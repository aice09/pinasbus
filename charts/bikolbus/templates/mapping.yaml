{{- if .Values.mapping.enabled }}
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "bikolbus.labels" . | nindent 4 }}
spec:
  hostname: {{ .Values.host }}
  prefix: /
  rewrite: ""
  service: {{ .Release.Name }}.{{ .Release.Namespace }}:80
  timeout_ms: 30000
{{- end }}
