{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-app" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  labels: {{- include "bikolbus.labels" . | nindent 4 }}
type: Opaque
data:
  # AES-256 key for secrets stored in the database (authenticator seeds). Generated once; rotating it disables existing two-step sign-ins.
  APP_SECRET_KEY: {{ if $existing }}{{ index $existing.data "APP_SECRET_KEY" }}{{ else }}{{ randAscii 32 | b64enc | b64enc }}{{ end }}
